name: "Publish Helm chart to ghcr.io (OCI)"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CHART_PATH: charts/kapparmor

permissions:
  contents: read

jobs:
  publish-helm-oci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | helm registry login "$REGISTRY" --username "$GH_ACTOR" --password-stdin

      - name: Extract chart version
        id: chart
        run: |
          version=$(grep '^version:' "$CHART_PATH/Chart.yaml" | awk '{print $2}' | tr -d '"')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint "$CHART_PATH"

      - name: Package chart
        run: helm package "$CHART_PATH" --destination .helm-pkg

      - name: Push chart to ghcr.io
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: helm push ".helm-pkg/kapparmor-${{ steps.chart.outputs.version }}.tgz" "oci://$REGISTRY/$REPO_OWNER/charts"

      - name: Verify published chart
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: helm show chart "oci://$REGISTRY/$REPO_OWNER/charts/kapparmor" --version "${{ steps.chart.outputs.version }}"
